name: TSX Daily Quant Scan

on:
  schedule:
    # 21:15 UTC = 16:15 EST / 17:15 EDT — after TSX close in both offsets
    - cron: "15 21 * * 1-5"
      timezone: 'America/Toronto'
  workflow_dispatch:

concurrency:
  group: tsx-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore cooldown DB
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if git cat-file -e "origin/${GITHUB_REF_NAME}:signals.db" 2>/dev/null; then
            git checkout "origin/${GITHUB_REF_NAME}" -- signals.db
            echo "Restored signals.db from origin/${GITHUB_REF_NAME}"
          else
            echo "No signals.db on origin/${GITHUB_REF_NAME} yet"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_RISK_CAD: "20.0"
          COOLDOWN_DAYS: "5"
          SIGNALS_DB: signals.db
        run: python scanner.py

      - name: Persist Database State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f signals.db ]; then
            echo "No signals.db to persist."
            exit 0
          fi

          cp signals.db "${RUNNER_TEMP}/signals.db"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp "${RUNNER_TEMP}/signals.db" signals.db

          git add -f signals.db
          if git diff --staged --quiet; then
            echo "No cooldown DB changes to commit."
          else
            git commit -m "chore: update SQLite cooldown state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
