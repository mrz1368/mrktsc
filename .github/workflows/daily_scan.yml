name: TSX Daily Quant Scan

on:
  schedule:
    # 16:15 America/Toronto — 15 min after TSX close (EDT/EST)
    - cron: "15 16 * * 1-5"
      timezone: 'America/Toronto'
  workflow_dispatch:

concurrency:
  group: tsx-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore cooldown DB
        uses: actions/cache@v6
        with:
          path: signals.db
          key: signals-db-${{ github.run_id }}
          restore-keys: |
            signals-db-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Market Scanner & Generate Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_RISK_CAD: "20.0"
          COOLDOWN_DAYS: "5"
          SIGNALS_DB: signals.db
        run: python scanner.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
