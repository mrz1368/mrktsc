name: TSX Daily Quant Scan

on:
  schedule:
    # 21:15 UTC = 16:15 EST / 17:15 EDT — after TSX close in both offsets
    - cron: "15 21 * * 1-5"
      timezone: 'America/Toronto'
  workflow_dispatch:

concurrency:
  group: tsx-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore cooldown DB
        uses: actions/cache@v6
        with:
          path: signals.db
          key: signals-db-${{ github.run_id }}
          restore-keys: |
            signals-db-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_RISK_CAD: "20.0"
          COOLDOWN_DAYS: "5"
          SIGNALS_DB: signals.db
        run: python scanner.py
