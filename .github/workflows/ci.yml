name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Lint only — project does not enforce `ruff format` (see ruff.toml).
      - name: Ruff
        run: ruff check .

      # Offline unit suite under tests/ only (pytest.ini testpaths); never scanner.py / test_run.py.
      - name: Pytest (offline)
        run: pytest
